# dist/optraining.html を GitHub Pages で公開する(https://mio9s.github.io/optraining/)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # テストと dist の一致を確かめてから公開する(失敗したコミットは公開しない)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo '::error::dist/optraining.html がソースと一致しません'; exit 1; }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp dist/optraining.html _site/index.html
          cp dist/optraining.html _site/optraining.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
