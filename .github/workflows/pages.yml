# dist/optraining.html を GitHub Pages で公開する(https://mio9s.github.io/optraining/)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# 既定は読み取りだけ。公開の権限は deploy ジョブにだけ渡す(依存を入れて走らせるテストには渡さない)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # テストと dist の一致を確かめてから公開する(失敗したコミットは公開しない)
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp dist/optraining.html _site/index.html
          cp dist/optraining.html _site/optraining.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
